# Mockery v3, testify template. The interface owner fills in `packages`:
#   cross-layer interfaces: internal/ports -> internal/mocks/ports (package portsmocks)
#   adapter-private seams: next to the code as *_mock_test.go
all: false
formatter: goimports
force-file-write: true
structname: '{{.Mock}}{{.InterfaceName}}'
template: testify
template-schema: '{{.Template}}.schema.json'
require-template-schema-exists: true
packages:
  github.com/bnema/nefercap/internal/ports:
    config:
      dir: internal/mocks/ports
      pkgname: portsmocks
      filename: '{{.InterfaceFile | base | trimSuffix ".go"}}_mock.go'
    interfaces:
      Source:
      ScreenshotWriter:
      Clipboard:
      VideoWriter:
      Selector:
  io:
    config:
      dir: internal/adapters/ffmpeg
      pkgname: ffmpeg
      filename: io_mock_test.go
    interfaces:
      Writer:
        config:
          structname: MockIOWriter
